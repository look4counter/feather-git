[package]
name = "feather-git"
version = "1.0.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gpui = "0.2.2"
gix = "0.90.0"
git2 = { version = "0.21.0", features = ["https"] }
similar = "3.2.1"
encoding_rs = "0.8.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
sha2 = "0.10.9"
futures = "0.3"
gpui_http_client = "0.2.2"
avatar_http = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
roxmltree = "0.20.0"
semver = "1.0.28"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.12"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
gpui = { path = "vendor/gpui" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

[profile.dev.package.gpui]
opt-level = 3
debug-assertions = false

[profile.dev.package.taffy]
opt-level = 3
