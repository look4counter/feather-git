[package]
name = "feather-git"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = "=0.2.2"
gix = "=0.87.1"
similar = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
